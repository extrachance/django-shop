{% extends 'shop/base.html' %}
{% block content %}
<h1 class="h3 mb-3">Каталог товаров</h1>
<div class="mb-3">
  <a href="{% url 'catalog' %}">Все</a>
  {% for c in categories %} | <a href="?category={{ c.slug }}">{{ c.name }}</a>{% endfor %}
</div>
<div class="row g-3">
  {% for p in products %}
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body">
        <h5>{{ p.name }}</h5>
        <p>{{ p.price }} сом</p>
        <a href="{% url 'detail' p.slug %}" class="btn btn-primary">Подробнее</a>
      </div>
    </div>
  </div>
  {% empty %}
  <p>Товаров нет</p>
  {% endfor %}
</div>
{% endblock %}
